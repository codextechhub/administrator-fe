name: CI

# staging as well as main, unlike console-fe's. This repo deploys by resetting
# staging to main and force-pushing it (deploy-staging.sh), so staging is a
# branch that reaches an environment and has to be tested like one.
on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # The codebase is at zero ESLint problems - keep it there.
      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx vite build
        env:
          # The build reads these; neither is contacted, and a real URL here
          # would bake a live backend into a CI artefact nobody deploys.
          VITE_BACKEND_URL: https://ci.invalid/v1
          VITE_APP_BASE_DOMAIN: ci.invalid
